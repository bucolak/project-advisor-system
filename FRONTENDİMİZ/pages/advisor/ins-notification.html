<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Notifications</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content">
          <div id="topbarArea"></div>  

            <div class="advisor-notif-header">
                <h1>Notifications</h1>
                <span class="advisor-notif-new" id="advisorNotifCount">0 New</span>
            </div>

        <div id="advisorNotificationsContainer">
            <div class="advisor-notif-card advisor-loading-card">
        
                <div class="advisor-notif-loading-icon">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
        
                <div class="advisor-notif-card-middle">
                    <p>Loading notifications...</p>
                </div>
        
            </div>
        </div>
        </main>
    <script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
    <script src="ins-notification.js"></script>
</body>

</html>
