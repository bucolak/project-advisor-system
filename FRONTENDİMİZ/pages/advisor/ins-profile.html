<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Profile</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content">
            <div id="topbarArea"></div>

            <div class="advisor-profile-header-row">
                <h1>My Profile</h1>

                <a href="ins-profile-edit.html" class="advisor-profile-edit-btn">
                    <i class="fa-regular fa-pen-to-square"></i>
                    Edit Profile
                </a>
            </div>

            <div class="advisor-profile-main-card">
                <div class="advisor-profile-main-left">
                    <i class="fa-regular fa-circle-user"></i>
                </div>

                <div class="advisor-profile-main-right">
                    <h2 id="advisorProfileName">Advisor</h2>
                    <p class="advisor-role">Advisor</p>

                    <div class="advisor-profile-info-list">
                        <p><strong>Department:</strong> <span id="advisorDepartment">-</span></p>
                        <p><strong>Title:</strong> <span id="advisorTitle">-</span></p>
                        <p><strong>E-mail:</strong> <span id="advisorEmail">-</span></p>
                     
                    </div>
                </div>
            </div>

            <div class="advisor-profile-bottom">
                <div class="advisor-profile-left-col">
                    <div class="advisor-profile-section">
                        <h3>Area of Expertise</h3>
                        <div class="advisor-profile-tags" id="advisorExpertiseTags">
                            <span>No expertise found</span>
                        </div>
                    </div>

                    <div class="advisor-profile-section research-section">
                        <h3>Research Interests</h3>
                        <ul class="advisor-profile-research-list" id="advisorResearchList">
                            <li>No research interests found</li>
                        </ul>
                    </div>
                </div>

                <div class="advisor-profile-right-col">
                    <div class="advisor-profile-section">
                        <h3>Previously Supervised<br />Project Types</h3>

                    <div class="advisor-profile-project-types" id="advisorProjectTypes">
                        <div class="project-type-row loading-row">
                            <span class="loading-dot">•</span>
                            <span class="type-text">Loading...</span>
                        </div>
                    </div>
                    </div>

                    <div class="advisor-profile-status-card">
                        <h3>Advising Status</h3>
                        <div class="advisor-profile-status-divider"></div>
                        <p id="advisorStatusCardText">Loading status...</p>
                        <button class="advisor-profile-active-btn" id="advisorStatusButton">-</button>
                    </div>
                </div>
            </div>
        </main>
    <script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
    <script src="ins-profile.js"></script>
</body>

</html>
