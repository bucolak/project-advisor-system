<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Edit Profile</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div class="advisor-edit-profile-page">
        <aside class="advisor-edit-profile-sidebar">
            <div class="advisor-edit-profile-sidebar-icon">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>
<ul class="advisor-edit-profile-menu">
    <li>
        <a href="ins-home.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
    </li>

    <li>
        <a href="ins.request.html">
            <i class="fa-regular fa-user"></i>
            <span>Requests</span>
        </a>
    </li>

    <li>
        <a href="ins-notification.html">
            <i class="fa-regular fa-bell"></i>
            <span>Notifications</span>
        </a>
    </li>

    <li>
        <a href="ins-profile-edit.html" class="active">
            <i class="fa-regular fa-circle-user"></i>
            <span>Profile</span>
        </a>
    </li>
</ul>
            
        </aside>

        <main class="advisor-edit-profile-content">
            <div class="advisor-edit-profile-topbar">
                <div class="advisor-user-dropdown">
                    <div class="advisor-user-box" onclick="toggleProfileMenu()">
                        <i class="fa-regular fa-circle-user"></i>
                        <div>
                            <div>Dr. Zeynep Pınarlı</div>
                            <small>Advisor</small>
                        </div>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>

                    <div class="advisor-dropdown-menu" id="profileDropdown">
                        <a href="../../index.html" class="advisor-logout-btn">Log Out</a>
                    </div>
                </div>
            </div>

            <div class="advisor-edit-profile-header-row">
                <h1>My Profile</h1>

                <div class="advisor-edit-profile-actions">
                    <a href="ins-profile.html" class="advisor-save-btn">Save Changes</a>
                    <a href="ins-profile.html" class="advisor-cancel-btn">Cancel</a>
                </div>
            </div>

            <div class="advisor-edit-profile-name-row">
                <div class="advisor-edit-profile-main-left">
                    <i class="fa-regular fa-circle-user"></i>
                </div>

                <div class="advisor-edit-profile-main-right">
                    <h2>Dr. Zeynep Pınarlı</h2>
                    <p class="advisor-edit-role">Advisor</p>
                </div>
            </div>

            <div class="advisor-edit-profile-card">
                <div class="advisor-edit-profile-form-top">
                    <div class="advisor-edit-profile-form-left">
                        <div class="advisor-edit-form-grid">
                            <div class="advisor-edit-form-group">
                                <label for="fullName">Full Name</label>
                                <input type="text" id="fullName" value="Zeynep Pınarlı" />
                            </div>

                            <div class="advisor-edit-form-group">
                                <label for="email">E-mail:</label>
                                <input type="email" id="email" value="zeynep.pinarli@uskudar.com" />
                            </div>

                            <div class="advisor-edit-form-group">
                                <label for="department">Department</label>
                                <input type="text" id="department" value="Software Engineering" />
                            </div>

                            <div class="advisor-edit-form-group">
                                <label for="title">Academic Title</label>
                                <input type="text" id="title" value="Associate Professor" />
                            </div>
                        </div>
                    </div>

                    <div class="advisor-edit-profile-photo-area">
                        <div class="advisor-edit-photo-box">
                            <i class="fa-regular fa-camera"></i>
                        </div>
                        <button class="advisor-upload-photo-btn">Upload New Photo</button>
                    </div>
                </div>

                <div class="advisor-edit-profile-section">
                    <div class="advisor-edit-section-title-row">
                        <h3>Area of Expertise</h3>
                    </div>

                    <input type="text" class="advisor-edit-full-input"
                        value="Artificial Intelligence, NLP, Machine Learning, IoT, Cyber Security" />
                </div>

                <div class="advisor-edit-profile-section">
                    <h3>Research Interests</h3>

                    <ul class="advisor-edit-interest-list">
                        <li><input type="text" value="AI applications in healthcare" /></li>
                        <li><input type="text" value="NLP technologies" /></li>
                        <li><input type="text" value="Cyber security and network monitoring" /></li>
                        <li><input type="text" value="IoT and smart systems" /></li>
                    </ul>
                </div>

                <div class="advisor-add-interest-row">
                    <button class="advisor-add-interest-btn">
                        <i class="fa-solid fa-plus"></i>
                        Add New Interest
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleProfileMenu() {
            document.getElementById("profileDropdown").classList.toggle("show");
        }

        window.addEventListener("click", function (e) {
            const dropdown = document.querySelector(".advisor-user-dropdown");
            const profileMenu = document.getElementById("profileDropdown");

            if (dropdown && !dropdown.contains(e.target)) {
                profileMenu.classList.remove("show");
            }
        });
    </script>
</body>

</html>
