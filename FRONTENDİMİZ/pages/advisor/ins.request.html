<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advisor Request</title>

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div id="sidebarArea"></div>

<main class="page-content">
      <div id="topbarArea"></div>

      <div class="advisor-request-header">
        <h1>Advisor Request</h1>
        <div class="advisor-request-pending">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span id="pendingRequestCount">0 Pending Requests</span>
        </div>
      </div>

      <div id="advisorRequestsContainer">
        <div class="request-card">
          <div class="request-card-left">
            <div class="request-project-title-row">
              <div class="request-project-title">Loading requests...</div>
            </div>
          </div>
        </div>
      </div>
    </main>
 

  <div class="student-modal-overlay" id="studentModal">
    <div class="student-modal">

      <div class="modal-top">
        <h2>Student Profile</h2>
        <div class="modal-tag" id="modalProjectTag">PROJECT</div>
      </div>

      <div class="modal-content">
        <div class="modal-left">
          <div class="student-basic">
            <i class="fa-regular fa-circle-user"></i>
            <div>
              <h3 id="modalStudentName">Student Name</h3>
              <p id="modalStudentDepartment">Department</p>
            </div>
          </div>

         <div class="student-detail-section">
  <h4>Interest:</h4>
  <ul id="modalStudentInterests">
    <li>No data</li>
  </ul>
</div>

<div class="student-detail-section">
  <h4>Technical Skills:</h4>
  <ul id="modalStudentSkills">
    <li>No data</li>
  </ul>
</div>
        </div>

        <div class="modal-right">
          <h3>Other Project</h3>
          <div id="modalOtherProjects">
            <div class="other-project-card">
              <h4>No other projects</h4>
              <p><strong>Project:</strong> No data</p>
              <p><strong>Skills:</strong> -</p>
            </div>
          </div>
        </div>
      </div>
<div class="modal-buttons">
  <button class="close-btn" id="modalCloseBtn">Close</button>
</div>
    </div>
  </div>
  <script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
  <script src="ins.request.js"></script>
</body>

</html>
