<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #111;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #d9d9d9;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #c7c7c7;
        }

        .sidebar-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            font-size: 22px;
            color: #222;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 16px;
        }

        .sidebar-menu li a {
            text-decoration: none;
            color: #111;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .sidebar-menu li a:hover {
            background: #cfcfcf;
        }

        .sidebar-menu li a.active {
            background: #2196f3;
            color: #fff;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 28px 36px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 28px;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #e4e4e4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .profile-box i.fa-circle-user {
            font-size: 28px;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .profile-info .name {
            font-size: 14px;
            font-weight: 600;
        }

        .profile-info .role {
            font-size: 12px;
            color: #666;
        }

        .page-title {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 26px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 42px;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            width: fit-content;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 18px;
            padding: 0 0 12px 0;
            cursor: pointer;
            color: #222;
            position: relative;
        }

        .tab-btn.active {
            color: #2196f3;
            font-weight: 600;
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 100%;
            height: 2px;
            background: #2196f3;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* FORM LAYOUT */
        .project-form {
            max-width: 1150px;
        }

        .full-width {
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 48px;
            align-items: start;
        }

        .left-column,
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-size: 18px;
            font-weight: 600;
        }

        .required-star {
            color: #e53935;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #999;
            background: #fff;
            border-radius: 0;
            font-size: 15px;
            outline: none;
        }

        textarea {
            resize: none;
            min-height: 220px;
        }

        .small-input {
            width: 160px;
        }

        .skills-box {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            border: 1px solid #bdbdbd;
            background: #f1f1f1;
            color: #666;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s ease;
            user-select: none;
        }

        .skill-tag:hover {
            background: #e6f2fe;
            border-color: #90caf9;
            color: #1976d2;
        }

        .skill-tag.selected {
            background: #2196f3;
            color: #fff;
            border-color: #2196f3;
        }

        .advisor-choice {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .advisor-label {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .advisor-buttons {
            display: flex;
            gap: 12px;
        }

        .toggle-btn {
            min-width: 72px;
            padding: 10px 18px;
            border: 1px solid #999;
            background: #fff;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s ease;
        }

        .toggle-btn.active {
            background: #2196f3;
            color: #fff;
            border-color: #2196f3;
        }

        .submit-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 34px;
        }

        .submit-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 14px 34px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-btn:hover {
            background: #1976d2;
        }

        @media (max-width: 1100px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .small-input {
                width: 100%;
            }

            .sidebar {
                width: 210px;
            }
        }

        @media (max-width: 780px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .main {
                padding: 20px;
            }

            .page-title {
                font-size: 30px;
            }

            .tabs {
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>
<ul class="sidebar-menu">
    <li>
        <a href="st-home.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>
    </li>

    <li>
        <a href="st-projects.html">
            <i class="fa-solid fa-briefcase"></i>
            My Projects
        </a>
    </li>

    <li>
        <a href="st-createprojects.html" class="active">
            <i class="fa-regular fa-square-plus"></i>
            Create Project
        </a>
    </li>

    <li>
        <a href="st-advisorrequests.html">
            <i class="fa-regular fa-rectangle-list"></i>
            Advisor Requests
        </a>
    </li>

    <li>
        <a href="st-advisors.html">
            <i class="fa-regular fa-user"></i>
            Advisors
        </a>
    </li>

    <li>
        <a href="st-notifications.html">
            <i class="fa-regular fa-bell"></i>
            Notifications
        </a>
    </li>

    <li>
        <a href="st-profile.html">
            <i class="fa-regular fa-circle-user"></i>
            Profile
        </a>
    </li>
</ul>
            
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="top-bar">
                <div class="profile-box">
                    <i class="fa-regular fa-circle-user"></i>
                    <div class="profile-info">
                        <span class="name">Sude Torun</span>
                        <span class="role">Student</span>
                    </div>
                    <i class="fa-solid fa-chevron-down" style="font-size: 12px;"></i>
                </div>
            </div>

            <h1 class="page-title">Create Project</h1>

            <div class="tabs">
                <button class="tab-btn active" data-tab="courseProject">Course Projects</button>
                <button class="tab-btn" data-tab="otherProject">Other Projects</button>
            </div>

            <!-- COURSE PROJECT -->
            <section class="tab-content active" id="courseProject">
                <form class="project-form">
                    <div class="full-width form-group">
                        <label>Project Title <span class="required-star">*</span></label>
                        <input type="text" placeholder="Write the project title" />
                    </div>

                    <div class="form-grid">
                        <div class="left-column">
                            <div class="form-group">
                                <label>Required Skills <span class="required-star">*</span></label>
                                <div class="skills-box">
                                    <span class="skill-tag">SQL</span>
                                    <span class="skill-tag">AI</span>
                                    <span class="skill-tag">Python</span>
                                    <span class="skill-tag">Java</span>
                                    <span class="skill-tag">UI/UX</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Team Size <span class="required-star">*</span></label>
                                <input class="small-input" type="number" min="1" placeholder="Enter team size" />
                            </div>

                            <div class="form-group">
                                <label>Roles Needed <span class="required-star">*</span></label>
                                <textarea style="min-height: 120px;" placeholder="Write needed roles"></textarea>
                            </div>
                        </div>

                        <div class="right-column">
                            <div class="form-group">
                                <label>Description <span class="required-star">*</span></label>
                                <textarea placeholder="Write a brief description of the project"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="submit-row">
                        <button type="submit" class="submit-btn">Create Project</button>
                    </div>
                </form>
            </section>

            <!-- OTHER PROJECT -->
            <section class="tab-content" id="otherProject">
                <form class="project-form">
                    <div class="full-width form-group">
                        <label>Project Title <span class="required-star">*</span></label>
                        <input type="text" placeholder="Write the project title" />
                    </div>

                    <div class="form-grid">
                        <div class="left-column">
                            <div class="form-group">
                                <label>Project Type <span class="required-star">*</span></label>
                                <select>
                                    <option value="">Select a project type</option>
                                    <option>Research Project</option>
                                    <option>Personal Project</option>
                                    <option>Competition Project</option>
                                    <option>Startup Project</option>
                                    <option>Social Responsibility Project</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Required Skills <span class="required-star">*</span></label>
                                <div class="skills-box">
                                    <span class="skill-tag">SQL</span>
                                    <span class="skill-tag">AI</span>
                                    <span class="skill-tag">Python</span>
                                    <span class="skill-tag">JavaScript</span>
                                    <span class="skill-tag">Communication</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Team Size <span class="required-star">*</span></label>
                                <input class="small-input" type="number" min="1" placeholder="Enter team size" />
                            </div>

                            <div class="form-group">
                                <label>Roles Needed <span class="required-star">*</span></label>
                                <textarea style="min-height: 120px;" placeholder="Write needed roles"></textarea>
                            </div>
                        </div>

                        <div class="right-column">
                            <div class="form-group">
                                <label>Description <span class="required-star">*</span></label>
                                <textarea placeholder="Write a brief description of the project"></textarea>
                            </div>

                            <div class="advisor-choice">
                                <div class="advisor-label">
                                    <i class="fa-regular fa-address-card"></i>
                                    <span>Need Advisor / Not</span>
                                </div>

                                <div class="advisor-buttons">
                                    <button type="button" class="toggle-btn active" data-advisor="yes">Yes</button>
                                    <button type="button" class="toggle-btn" data-advisor="no">No</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="submit-row">
                        <button type="submit" class="submit-btn">Create Project</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
        // TAB SWITCH
        const tabButtons = document.querySelectorAll(".tab-btn");
        const tabContents = document.querySelectorAll(".tab-content");

        tabButtons.forEach(button => {
            button.addEventListener("click", () => {
                const target = button.dataset.tab;

                tabButtons.forEach(btn => btn.classList.remove("active"));
                tabContents.forEach(content => content.classList.remove("active"));

                button.classList.add("active");
                document.getElementById(target).classList.add("active");
            });
        });

        // SKILL TAG SELECT
        const skillTags = document.querySelectorAll(".skill-tag");
        skillTags.forEach(tag => {
            tag.addEventListener("click", () => {
                tag.classList.toggle("selected");
            });
        });

        // ADVISOR YES/NO TOGGLE
        const advisorButtons = document.querySelectorAll(".toggle-btn");
        advisorButtons.forEach(button => {
            button.addEventListener("click", () => {
                advisorButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");
            });
        });

        // FORM SUBMIT PREVENT DEFAULT
        const forms = document.querySelectorAll("form");
        forms.forEach(form => {
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                alert("Project created successfully! (Frontend demo)");
            });
        });
    </script>
</body>

</html>
