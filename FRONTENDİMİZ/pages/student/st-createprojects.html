<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Project</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f5f6f8;
      color: #111;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #d9d9d9;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #c7c7c7;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .sidebar-top {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
      font-size: 22px;
      color: #222;
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 16px;
    }

    .sidebar-menu li a {
      text-decoration: none;
      color: #111;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .sidebar-menu li a:hover {
      background: #cfcfcf;
    }

    .sidebar-menu li a.active {
      background: #2196f3;
      color: #fff;
    }

    .main {
      flex: 1;
      padding: 28px 36px 40px;
      min-width: 0;
      position: relative;
      z-index: 2;
    }

    #topbarArea {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 20;
      width: 100%;
    }

    .page-title {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 26px;
    }

    .tabs {
      display: flex;
      gap: 42px;
      margin-bottom: 30px;
      border-bottom: 1px solid #ddd;
      width: fit-content;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: 18px;
      padding: 0 0 12px 0;
      cursor: pointer;
      color: #222;
      position: relative;
    }

    .tab-btn.active {
      color: #2196f3;
      font-weight: 600;
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 2px;
      background: #2196f3;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .project-form {
      max-width: 1150px;
    }

    .full-width {
      margin-bottom: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 48px;
      align-items: start;
    }

    .left-column,
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group label {
      font-size: 18px;
      font-weight: 600;
    }

    .required-star {
      color: #e53935;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #999;
      background: #fff;
      border-radius: 0;
      font-size: 15px;
      outline: none;
    }

    textarea {
      resize: none;
      min-height: 220px;
    }

    .small-input {
      width: 160px;
    }

    .skills-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      border: 1px solid #bdbdbd;
      background: #f1f1f1;
      color: #666;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s ease;
      user-select: none;
    }

    .skill-tag:hover {
      background: #e6f2fe;
      border-color: #90caf9;
      color: #1976d2;
    }

    .skill-tag.selected {
      background: #2196f3;
      color: #fff;
      border-color: #2196f3;
    }

    .advisor-choice {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .advisor-label {
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .advisor-buttons {
      display: flex;
      gap: 12px;
    }

    .toggle-btn {
      min-width: 72px;
      padding: 10px 18px;
      border: 1px solid #999;
      background: #fff;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .toggle-btn.active {
      background: #2196f3;
      color: #fff;
      border-color: #2196f3;
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 34px;
    }

    .submit-btn {
      background: #2196f3;
      color: white;
      border: none;
      padding: 14px 34px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:hover {
      background: #1976d2;
    }
  </style>
</head>

<body>
  <div id="sidebarArea"></div>

<main class="page-content main">
      <div id="topbarArea"></div>

      <h1 class="page-title">Create Project</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="courseProject">Course Projects</button>
        <button class="tab-btn" data-tab="otherProject">Other Projects</button>
      </div>

      <section class="tab-content active" id="courseProject">
        <form class="project-form" id="courseProjectForm">
          <div class="full-width form-group">
            <label>Project Title <span class="required-star">*</span></label>
            <input type="text" id="courseTitle" placeholder="Write the project title" />
          </div>

          <div class="form-grid">
            <div class="left-column">
              <div class="form-group">
                <label>Required Skills <span class="required-star">*</span></label>
                <div class="skills-box">
                  <span class="skill-tag">SQL</span>
                  <span class="skill-tag">AI</span>
                  <span class="skill-tag">Python</span>
                  <span class="skill-tag">JavaScript</span>
                  <span class="skill-tag">Communication</span>
                  <span class="skill-tag">Java</span>
                  <span class="skill-tag">C#</span>
                  <span class="skill-tag">HTML</span>
                  <span class="skill-tag">CSS</span>
                  <span class="skill-tag">React</span>
                  <span class="skill-tag">Node.js</span>
                  <span class="skill-tag">Spring Boot</span>
                  <span class="skill-tag">Machine Learning</span>
                  <span class="skill-tag">UI/UX</span>
                  <span class="skill-tag">Database</span>
                </div>
              </div>

              <div class="form-group">
                <label>Team Size <span class="required-star">*</span></label>
                <input class="small-input" id="courseTeamSize" type="number" min="1" placeholder="Enter team size" />
              </div>

              <div class="form-group">
                <label>Roles Needed <span class="required-star">*</span></label>
                <textarea id="courseRoles" style="min-height: 120px;" placeholder="Write needed roles"></textarea>
              </div>
            </div>

            <div class="right-column">
              <div class="form-group">
                <label>Description <span class="required-star">*</span></label>
                <textarea id="courseDescription" placeholder="Write a brief description of the project"></textarea>
              </div>
            </div>
          </div>

          <div class="submit-row">
            <button type="submit" class="submit-btn">Create Project</button>
          </div>
        </form>
      </section>

      <section class="tab-content" id="otherProject">
        <form class="project-form" id="otherProjectForm">
          <div class="full-width form-group">
            <label>Project Title <span class="required-star">*</span></label>
            <input type="text" id="otherTitle" placeholder="Write the project title" />
          </div>

          <div class="form-grid">
            <div class="left-column">
              <div class="form-group">
                <label>Project Type <span class="required-star">*</span></label>
                <select id="projectTypeSelect">
                  <option value="">Loading project types...</option>
                </select>
              </div>

              <div class="form-group">
                <label>Required Skills <span class="required-star">*</span></label>
                <div class="skills-box">
                  <span class="skill-tag">SQL</span>
                  <span class="skill-tag">AI</span>
                  <span class="skill-tag">Python</span>
                  <span class="skill-tag">JavaScript</span>
                  <span class="skill-tag">Communication</span>
                  <span class="skill-tag">Java</span>
                  <span class="skill-tag">C#</span>
                  <span class="skill-tag">HTML</span>
                  <span class="skill-tag">CSS</span>
                  <span class="skill-tag">React</span>
                  <span class="skill-tag">Node.js</span>
                  <span class="skill-tag">Spring Boot</span>
                  <span class="skill-tag">Machine Learning</span>
                  <span class="skill-tag">UI/UX</span>
                  <span class="skill-tag">Database</span>
                </div>
              </div>

              <div class="form-group">
                <label>Team Size <span class="required-star">*</span></label>
                <input class="small-input" id="otherTeamSize" type="number" min="1" placeholder="Enter team size" />
              </div>

              <div class="form-group">
                <label>Roles Needed <span class="required-star">*</span></label>
                <textarea id="otherRoles" style="min-height: 120px;" placeholder="Write needed roles"></textarea>
              </div>
            </div>

            <div class="right-column">
              <div class="form-group">
                <label>Description <span class="required-star">*</span></label>
                <textarea id="otherDescription" placeholder="Write a brief description of the project"></textarea>
              </div>

              <div class="advisor-choice" id="advisorChoiceBox">
                <div class="advisor-label">
                  <i class="fa-regular fa-address-card"></i>
                  <span>Need Advisor / Not</span>
                </div>

                <div class="advisor-buttons">
                  <button type="button" class="toggle-btn active" data-advisor="yes">Yes</button>
                  <button type="button" class="toggle-btn" data-advisor="no">No</button>
                </div>
              </div>
            </div>
                    </div>

          <div class="submit-row">
            <button type="submit" class="submit-btn">Create Project</button>
          </div>
        </form>
      </section>
       </main>

  
 <script src="../../components/sidebar.js"></script>
  <script src="../../components/topbar.js"></script>
  <script src="st-createprojects.js"></script>
</body>

</html>
