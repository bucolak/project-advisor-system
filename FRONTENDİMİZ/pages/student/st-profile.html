<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

    <div id="sidebarArea"></div>

    <main class="page-content main">

        <div id="topbarArea"></div>

        <h1 class="profile-title">Profile</h1>

        <div class="profile-card">

            <div class="profile-card-top">

                <div class="profile-user-area">

                    <i class="fa-regular fa-circle-user"></i>

                    <div class="profile-main-info">

                        <h2 id="profileFullName">
                            Student Name
                        </h2>

                        <p class="profile-line">
                            <strong>Department:</strong>
                            <span id="profileDepartment">-</span>
                        </p>

                        <p class="profile-line">
                            <strong>Year:</strong>
                            <span id="profileYear">-</span>
                        </p>

                        <p class="profile-line">
                            <strong>GPA:</strong>
                            <span id="profileGpa">-</span>
                        </p>

                    </div>

                </div>

                <a href="student-profile-edit.html" class="student-profile-edit-btn">
                    <i class="fa-regular fa-pen-to-square"></i>
                    Edit Profile
                </a>

            </div>

            <div class="profile-contact-info">

                <p class="profile-line">
                    <strong>E-mail:</strong>
                    <span id="profileEmail">-</span>
                </p>

                <p class="profile-line">
                    <strong>Interests:</strong>
                    <span id="profileInterests">-</span>
                </p>

                <p class="profile-line">
                    <strong>Git-Hub link:</strong>
                    <span id="profileGithub">-</span>
                </p>

                <p class="profile-line">
                    <strong>LinkedIn link:</strong>
                    <span id="profileLinkedin">-</span>
                </p>

            </div>

        </div>

        <div class="profile-bottom-section">

            <div class="profile-bio-box">

                <h3>Short bio:</h3>

                <div class="bio-area" id="profileBio">
                    No bio information.
                </div>

            </div>

            <div class="profile-skills-box">

                <h3>Technical Skills:</h3>

                <div class="skills-area" id="profileSkills">
                    <span class="skill-tag">
                        No skills found
                    </span>
                </div>

            </div>

        </div>

    </main>

    <script src="../../components/sidebar.js"></script>
    <script src="../../components/topbar.js"></script>
    <script src="st-profile.js"></script>

</body>

</html>
