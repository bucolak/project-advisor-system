<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content main">
            <div id="topbarArea"></div>

            <h1 class="profile-title">Profile</h1>

            <div class="profile-card">
                <div class="profile-card-top">
                    <div class="profile-user-area">
                        <i class="fa-regular fa-circle-user"></i>

                        <div class="profile-main-info">
                            <h2 id="profileFullName">Student Name</h2>

                            <div class="profile-info-row">
                                <span class="label">Department:</span>
                                <span class="value long" id="profileDepartment">-</span>
                            </div>

                            <div class="profile-info-row">
                                <span class="label">Year:</span>
                                <span class="value short" id="profileYear">-</span>
                            </div>
                        </div>
                    </div>

                    <a href="student-profile-edit.html" class="student-profile-edit-btn">
                        <i class="fa-regular fa-pen-to-square"></i>
                        Edit Profile
                    </a>
                </div>

                <div class="profile-contact-info">
                    <div class="profile-info-row">
                        <span class="label">E-mail:</span>
                        <span class="value email" id="profileEmail">-</span>
                    </div>

                    <div class="profile-info-row">
                        <span class="label">Interests:</span>
                        <span class="value" id="profileInterests">-</span>
                    </div>

                    <div class="profile-info-row">
                        <span class="label">Git-Hub link:</span>
                        <span class="value medium" id="profileGithub">-</span>
                    </div>

                    <div class="profile-info-row">
                        <span class="label">LinkedIn link:</span>
                        <span class="value medium" id="profileLinkedin">-</span>
                    </div>
                </div>
            </div>

            <div class="profile-bottom-section">
                <div class="profile-bio-box">
                    <h3>Short bio:</h3>
                    <div class="bio-area" id="profileBio">No bio information.</div>
                </div>

                <div class="profile-skills-box">
                    <h3>Technical Skills:</h3>
                    <div class="skills-area" id="profileSkills">
                        <span class="skill-tag">No skills found</span>
                    </div>
                </div>
            </div>
        </main>
  <script src="../../components/sidebar.js"></script>  
<script src="../../components/topbar.js"></script>
    <script src="st-profile.js"></script>
</body>

</html>
