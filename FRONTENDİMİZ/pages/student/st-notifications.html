<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div id="sidebarArea"></div>

    <main class="page-content">

        <div id="topbarArea"></div>

        <div class="notifications-header">
            <h1 class="notifications-title">Notifications</h1>
            <span class="notifications-new-count" id="notificationsNewCount">0 New</span>
        </div>

        <div id="studentRequestSection"></div>

        <div id="notificationsList">
            <div class="notification-item no-notification-box">
                <i class="fa-regular fa-circle-user"></i>
                <span>No new notifications.</span>
            </div>
        </div>

    </main>

    <div class="student-profile-overlay" id="studentProfileOverlay">
        <div class="student-profile-modal">

            <div class="student-profile-top">
                <h2>Student Profile</h2>
                <span class="student-profile-tag" id="studentProfileTag">PROJECT</span>
            </div>

            <div class="student-profile-content">
                <div class="student-profile-left">
                    <div class="student-profile-basic">
                        <i class="fa-regular fa-circle-user"></i>

                        <div class="student-profile-name">
                            <h3 id="modalStudentName">Student Name</h3>
                            <p id="modalStudentDepartment">Department</p>
                        </div>
                    </div>

                    <div class="student-profile-section">
                        <h4>Relevant Courses:</h4>
                        <ul id="modalRelevantCourses">
                            <li>No data</li>
                        </ul>
                    </div>

                    <div class="student-profile-section">
                        <h4>Research Interests:</h4>
                        <ul id="modalResearchInterests">
                            <li>No data</li>
                        </ul>
                    </div>
                </div>

                <div class="student-profile-right">
                    <h3>Other Projects</h3>

                    <div id="modalStudentProjects">
                        <div class="student-project-card">
                            <div class="student-project-header">
                                <h4>No other projects</h4>
                            </div>

                            <div class="student-project-body">
                                <p><strong>Project:</strong> No data</p>
                            </div>

                            <div class="student-project-footer">
                                <p><strong>Skills:</strong> -</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="student-profile-bottom">
                <button class="student-profile-close-btn" id="closeStudentProfileBtn">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script src="../../components/sidebar.js"></script>
    <script src="../../components/topbar.js"></script>
    <script src="st-notifications.js"></script>
</body>

</html>
