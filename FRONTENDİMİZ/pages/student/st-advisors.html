<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisors</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div class="advisors-page">
        <aside class="advisors-sidebar">
            <div class="advisors-sidebar-icon">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>

            <ul class="advisors-sidebar-menu">
                <li>
                    <a href="st-home.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li>
                    <a href="st-projects.html">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>My Projects</span>
                    </a>
                </li>

                <li>
                    <a href="st-createprojects.html">
                        <i class="fa-regular fa-square-plus"></i>
                        <span>Create Project</span>
                    </a>
                </li>

                <li>
                    <a href="st-advisorrequests.html">
                        <i class="fa-regular fa-rectangle-list"></i>
                        <span>Advisors Requests</span>
                    </a>
                </li>

                <li>
                    <a href="st-advisors.html" class="active">
                        <i class="fa-regular fa-user"></i>
                        <span>Advisors</span>
                    </a>
                </li>

                <li>
                    <a href="st-notifications.html">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>

                <li>
                    <a href="st-profile.html">
                        <i class="fa-regular fa-circle-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="advisors-content">
            <div class="advisors-topbar">
                <div class="advisors-user-dropdown">
                    <div class="advisors-student-box" id="advisorsStudentBox">
                        <i class="fa-regular fa-circle-user"></i>

                        <div class="advisors-student-info">
                            <span class="advisors-student-name" id="advisorsStudentName">Student Name</span>
                            <span class="advisors-student-role">Student</span>
                        </div>

                        <i class="fa-solid fa-chevron-down"></i>
                    </div>

                    <div class="advisors-dropdown-menu" id="advisorProfileDropdown">
                        <a href="../../index.html" class="advisors-logout-btn" id="advisorsLogoutBtn">Log Out</a>
                    </div>
                </div>
            </div>

            <h1 class="advisors-title">Advisors</h1>
            <p class="advisors-subtitle">Browse and request advisors for your projects.</p>

            <div class="advisors-search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="advisorSearch"
                    placeholder="Search by department, expertise or status: (active / inactive)" />
            </div>

            <p id="noAdvisorMessage" class="no-advisor-message" style="display: none;">
                No advisor found.
            </p>

            <div class="advisors-table-wrapper" id="advisorsTableWrapper">
                <table class="advisors-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Expertise</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="advisorsTableBody">
                        <tr>
                            <td colspan="4">Loading advisors...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="request-modal-overlay" id="requestModal">
        <div class="request-modal">
            <div class="request-modal-header">
                <h2>Request Advisor</h2>
                <button class="request-modal-close" id="closeRequestModalBtn">×</button>
            </div>

            <div class="request-modal-body">
                <label for="projectSelect">Project:</label>
                <select id="projectSelect" class="request-project-select">
                    <option value="">Select a project</option>
                </select>
            </div>

            <div class="request-modal-footer">
                <button class="request-cancel-btn" id="cancelRequestBtn">Cancel</button>
                <button class="request-send-btn" id="sendRequestBtn">Send Request</button>
            </div>
        </div>
    </div>

    <script src="st-advisors.js"></script>
</body>

</html>
