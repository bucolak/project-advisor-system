<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css" />
</head>

<body class="dashboard-page">

    <div class="dashboard-container">

        <div id="sidebarArea"></div>

        <main class="main-content">

            <div id="topbarArea"></div>

            <div class="row">
                <div class="card">
                    <h2 id="welcomeText">Welcome 👋</h2>
                    <p>Department: <span id="studentDepartment"></span></p>
                    <p>Year: <span id="studentYear"></span></p>
                </div>

                <div class="card">
                    <h3>My Advisors</h3>
                    <div id="myAdvisorsList">
                        <p>No advisor data yet.</p>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="card">
                    <h3>Announcements</h3>
                    <ul id="announcementsList">
                        <li>No announcements yet.</li>
                    </ul>
                </div>

                <div class="card">
                    <h3>Advisor Requests</h3>
                    <div id="advisorRequestsList">
                        <p>No advisor requests yet.</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="open-projects-header">
                    <h3>Open Projects</h3>

                    <div class="open-projects-filter">
                        <label for="projectCategoryFilter">Project Type:</label>

                        <select id="projectCategoryFilter">
                            <option value="ALL">All</option>
                        </select>
                    </div>
                </div>

                <div class="project-grid" id="openProjectsList">
                    <div class="project-card">
                        <h4>No open projects yet</h4>
                        <p>Projects will appear here when connected to backend.</p>
                    </div>
                </div>
            </div>

        </main>

    </div>
    <script src="../../components/sidebar.js"></script>
    <script src="../../components/topbar.js"></script>
    <script src="st-home.js"></script>

</body>

</html>
