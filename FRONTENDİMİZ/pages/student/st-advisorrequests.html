<body>

    <div class="advisor-page">
        <aside class="advisor-sidebar">
            <div class="sidebar-icon">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>

            <ul class="sidebar-menu">
                <li>
                    <a href="st-home.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li>
                    <a href="st-projects.html">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>My Projects</span>
                    </a>
                </li>

                <li>
                    <a href="st-createprojects.html">
                        <i class="fa-regular fa-square-plus"></i>
                        <span>Create Project</span>
                    </a>
                </li>

               

                <li>
                    <a href="st-advisors.html">
                        <i class="fa-regular fa-user"></i>
                        <span>Advisors</span>
                    </a>
                </li>
         <li>
    <a href="st-advisorrequest.html" class="active">
        <i class="fa-regular fa-rectangle-list"></i>
        <span>Advisor Requests</span>
    </a>
       </li>
                <li>
                    <a href="st-notifications.html">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>

                <li>
                    <a href="st-profile.html">
                        <i class="fa-regular fa-circle-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="advisor-content">
            <div class="advisor-topbar">
                <div class="advisor-user-dropdown">
                    <div class="student-box" id="studentBox">
                        <i class="fa-regular fa-circle-user"></i>

                        <div class="student-info">
                            <span class="student-name" id="studentName">Student Name</span>
                            <span class="student-role">Student</span>
                        </div>

                        <i class="fa-solid fa-chevron-down"></i>
                    </div>

                    <div class="advisor-dropdown-menu" id="profileDropdown">
                        <a href="../../index.html" class="advisor-logout-btn" id="logoutBtn">
                            Log Out
                        </a>
                    </div>
                </div>
            </div>

            <h1 class="advisor-title">Advisor Requests</h1>

            <div class="advisor-table-wrapper">
                <table class="advisor-table">
                    <thead>
                        <tr>
                            <th>Advisor</th>
                            <th>Project</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="advisorRequestsTableBody">
                        <tr>
                            <td colspan="3" class="empty-row">
                                Loading advisor requests...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
