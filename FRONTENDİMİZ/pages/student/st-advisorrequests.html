<ul class="sidebar-menu">

        </aside>

        <main class="advisor-content">
        <div class="advisor-topbar">
            <div class="advisor-user-dropdown">
                <div class="student-box" onclick="toggleProfileMenu()">
                    <i class="fa-regular fa-circle-user"></i>
        
                    <div class="student-info">
                        <span class="student-name">Sude Torun</span>
                        <span class="student-role">Student</span>
                    </div>
        
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
        
                <div class="advisor-dropdown-menu" id="profileDropdown">
                    <a href="../../index.html" class="advisor-logout-btn">Log Out</a>
                </div>
            </div>
        </div>
            <h1 class="advisor-title">Advisor Requests</h1>

            <div class="advisor-table-wrapper">
                <table class="advisor-table">
                    <thead>
                        <tr>
                            <th>Advisor</th>
                            <th>Project</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr id="requestRow1">
                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-circle-user"></i>
                                    <span>İrem Taş</span>
                                </div>
                            </td>

                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-rectangle-list"></i>
                                    <span>Fitness App</span>
                                </div>
                            </td>

                            <td>
                                <div class="status-area">
                                    <span class="status-badge pending">
                                        <i class="fa-solid fa-rotate-right"></i>
                                        Pending
                                    </span>

                                    <button class="withdraw-btn" onclick="withdrawRequest('requestRow1')">
                                        Withdraw
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-circle-user"></i>
                                    <span>Nur Çelik</span>
                                </div>
                            </td>

                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-rectangle-list"></i>
                                    <span>React Web App</span>
                                </div>
                            </td>

                            <td>
                                <div class="status-area">
                                    <span class="status-badge accepted">
                                        <i class="fa-solid fa-circle-check"></i>
                                        Accepted
                                    </span>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-circle-user"></i>
                                    <span>Mehmet Kara</span>
                                </div>
                            </td>

                            <td>
                                <div class="table-flex">
                                    <i class="fa-regular fa-rectangle-list"></i>
                                    <span>Web Platform</span>
                                </div>
                            </td>

                            <td>
                                <div class="status-area">
                                    <span class="status-badge rejected">
                                        <i class="fa-solid fa-xmark"></i>
                                        Rejected
                                    </span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        function withdrawRequest(rowId) {
            const row = document.getElementById(rowId);

            row.style.transition = "all 0.3s ease";
            row.style.opacity = "0";
           

            setTimeout(() => {
                row.remove();
            }, 300);
        }
    </script>
<script>
    function withdrawRequest(rowId) {
        const row = document.getElementById(rowId);

        row.style.transition = "all 0.3s ease";
        row.style.opacity = "0";

        setTimeout(() => {
            row.remove();
        }, 300);
    }

    function toggleProfileMenu() {
        document.getElementById("profileDropdown").classList.toggle("show");
    }

    window.addEventListener("click", function (e) {
        const dropdown = document.querySelector(".advisor-user-dropdown");

        if (!dropdown.contains(e.target)) {
            document.getElementById("profileDropdown").classList.remove("show");
        }
    });
</script>
</body>

</html>
