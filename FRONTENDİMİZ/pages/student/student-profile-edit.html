<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Edit</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
      
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content main">
            <div id="topbarArea"></div>

            <h1 class="student-profile-edit-title">Profile</h1>

            <div class="student-profile-edit-card">
                <div class="student-profile-edit-header">

                    <div class="student-profile-edit-maininfo">
                        <h2 id="studentDisplayName">Student</h2>

                        <div class="student-profile-edit-row">
                            <label>Department:</label>
                            <input type="text" id="studentDepartment" value="" />
                        </div>

                        <div class="student-profile-edit-row">
                            <label>Year:</label>
                            <input type="text" id="studentYear" value="" />
                        </div>
                    </div>

                    <div class="student-profile-edit-actions">
                        <button type="button" class="student-save-btn" id="studentSaveBtn">
                            <i class="fa-regular fa-pen-to-square"></i>
                            Save Changes
                        </button>

                        <a href="st-profile.html" class="student-cancel-btn">Cancel</a>
                    </div>
                </div>

                <div class="student-profile-edit-info">
                    <div class="student-profile-edit-row full">
                        <label>E-mail:</label>
                        <input type="email" id="studentEmail" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>Interests:</label>
                        <input type="text" id="studentInterests" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>Git-Hub link:</label>
                        <input type="text" id="studentGithub" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>LinkedIn link:</label>
                        <input type="text" id="studentLinkedin" value="" />
                    </div>
                </div>
            </div>

            <div class="student-profile-edit-bottom">
                <div class="student-profile-edit-bio-box">
                    <label>Short bio:</label>
                    <textarea id="studentBio" placeholder="No bio found."></textarea>
                </div>

                <div class="student-profile-edit-skills-box">
                    <label>Technical Skills:</label>

                    <div class="student-profile-edit-skills" id="studentSkillsContainer">
                        <span class="skill-tag" data-skill="SQL">SQL</span>
                        <span class="skill-tag" data-skill="AI">AI</span>
                        <span class="skill-tag" data-skill="Python">Python</span>
                        <span class="skill-tag" data-skill="Java">Java</span>
                        <span class="skill-tag" data-skill="JavaScript">JavaScript</span>
                        <span class="skill-tag" data-skill="C#">C#</span>
                        <span class="skill-tag" data-skill="HTML">HTML</span>
                        <span class="skill-tag" data-skill="CSS">CSS</span>
                        <span class="skill-tag" data-skill="React">React</span>
                        <span class="skill-tag" data-skill="Node.js">Node.js</span>
                        <span class="skill-tag" data-skill="Spring Boot">Spring Boot</span>
                        <span class="skill-tag" data-skill="Database">Database</span>
                        <span class="skill-tag" data-skill="Machine Learning">Machine Learning</span>
                        <span class="skill-tag" data-skill="UI/UX">UI/UX</span>
                        <span class="skill-tag" data-skill="Communication">Communication</span>
                    </div>
                </div>
            </div>
        </main>
    <script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
    <script src="student-profile-edit.js"></script>
</body>

</html>
