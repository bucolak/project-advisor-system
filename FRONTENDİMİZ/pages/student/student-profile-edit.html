<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Edit</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div class="student-profile-edit-page">
        <aside class="student-profile-edit-sidebar">
            <div class="student-profile-edit-sidebar-icon">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>

            <ul class="student-profile-edit-menu">
                <li>
                    <a href="st-home.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>

                <li>
                    <a href="st-projects.html">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>My Projects</span>
                    </a>
                </li>

                <li>
                    <a href="st-createprojects.html">
                        <i class="fa-regular fa-square-plus"></i>
                        <span>Create Project</span>
                    </a>
                </li>

                <li>
                    <a href="st-advisorrequests.html">
                        <i class="fa-regular fa-rectangle-list"></i>
                        <span>Advisor Requests</span>
                    </a>
                </li>

                <li>
                    <a href="st-advisors.html">
                        <i class="fa-regular fa-user"></i>
                        <span>Advisors</span>
                    </a>
                </li>

                <li>
                    <a href="st-notifications.html">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifications</span>
                    </a>
                </li>

                <li>
                    <a href="st-profile.html" class="active">
                        <i class="fa-regular fa-circle-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="student-profile-edit-content">
            <div class="student-profile-edit-topbar">
                <div class="student-profile-edit-user-dropdown">
                    <div class="student-profile-edit-userbox" id="studentProfileEditUserBox">
                        <i class="fa-regular fa-circle-user"></i>

                        <div class="student-profile-edit-userinfo">
                            <span id="studentTopName">Student</span>
                            <small>Student</small>
                        </div>

                        <i class="fa-solid fa-chevron-down"></i>
                    </div>

                    <div class="student-profile-edit-dropdown-menu" id="studentProfileEditDropdown">
                        <a href="../../index.html" class="student-profile-edit-logout-btn"
                            id="studentProfileEditLogoutBtn">
                            Log Out
                        </a>
                    </div>
                </div>
            </div>

            <h1 class="student-profile-edit-title">Profile</h1>

            <div class="student-profile-edit-card">
                <div class="student-profile-edit-header">
                    <div class="student-profile-edit-photo-box">
                        <i class="fa-regular fa-camera"></i>
                    </div>

                    <div class="student-profile-edit-maininfo">
                        <h2 id="studentDisplayName">Student</h2>

                        <div class="student-profile-edit-row">
                            <label>Department:</label>
                            <input type="text" id="studentDepartment" value="" />
                        </div>

                        <div class="student-profile-edit-row">
                            <label>Year:</label>
                            <input type="text" id="studentYear" value="" />
                        </div>
                    </div>

                    <div class="student-profile-edit-actions">
                        <button type="button" class="student-save-btn" id="studentSaveBtn">
                            <i class="fa-regular fa-pen-to-square"></i>
                            Save Changes
                        </button>
                        <a href="st-profile.html" class="student-cancel-btn">Cancel</a>
                    </div>
                </div>

                <div class="student-profile-edit-info">
                    <div class="student-profile-edit-row full">
                        <label>E-mail:</label>
                        <input type="email" id="studentEmail" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>Interests:</label>
                        <input type="text" id="studentInterests" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>Git-Hub link:</label>
                        <input type="text" id="studentGithub" value="" />
                    </div>

                    <div class="student-profile-edit-row full">
                        <label>LinkedIn link:</label>
                        <input type="text" id="studentLinkedin" value="" />
                    </div>
                </div>
            </div>

            <div class="student-profile-edit-bottom">
                <div class="student-profile-edit-bio-box">
                    <label>Short bio:</label>
                    <textarea id="studentBio" placeholder="No bio found."></textarea>
                </div>

                <div class="student-profile-edit-skills-box">
                    <label>Technical Skills:</label>

                    <div class="student-profile-edit-skills" id="studentSkillsContainer">
                        <span class="student-no-skill-text">No skills found.</span>
                    </div>

                    <button type="button" class="student-add-skill-btn" id="studentAddSkillBtn">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="student-profile-edit.js"></script>
</body>

</html>
