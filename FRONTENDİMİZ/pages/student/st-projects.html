<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div id="sidebarArea"></div>

  <main class="page-content st-projects-content">
    <div id="topbarArea"></div>

    <section class="st-projects-header">
      <h1>My Projects</h1>
      <p>View the details of your own projects</p>
    </section>

    <section class="st-projects-section">
      <div class="st-projects-section-title">
        <i class="fa-regular fa-folder-open"></i>
        <span>The projects that I joined,</span>
      </div>

      <div class="st-projects-cards" id="joinedProjectsContainer">
        <div class="st-projects-card">
          <div class="st-projects-card-header">
            <h3>Loading joined projects...</h3>
          </div>
        </div>
      </div>
    </section>

    <section class="st-projects-section st-projects-section-bottom">
      <div class="st-projects-section-title">
        <i class="fa-regular fa-folder-open"></i>
        <span>The projects that I created,</span>
      </div>

      <div class="st-projects-cards" id="createdProjectsContainer">
        <div class="st-projects-card">
          <div class="st-projects-card-header">
            <h3>Loading created projects...</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../components/sidebar.js"></script>
  <script src="../../components/topbar.js"></script>
  <script src="st-projects.js"></script>
</body>

</html>
