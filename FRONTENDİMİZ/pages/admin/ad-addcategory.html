<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Add New Category</title>

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div id="sidebarArea"></div>

<main class="page-content">

      <div id="topbarArea"></div>


      <h1 class="admin-addcat-title">
        Add New Category
      </h1>


      <form id="createCategoryForm" class="admin-addcat-card">

        <div class="admin-addcat-field">
          <label>
            <i class="fa-regular fa-folder-open"></i>
            Category Name
          </label>

          <input id="categoryName" type="text" placeholder="Enter category name" required />
        </div>



        <div class="admin-addcat-field">
          <label>
            <i class="fa-regular fa-folder"></i>
            Description
          </label>

          <textarea id="categoryDescription" placeholder="Enter description" required></textarea>

        </div>



        <div class="admin-addcat-row">

          <div class="admin-addcat-half">
            <label>
              <i class="fa-solid fa-users"></i>
              Team Size 
            </label>

            <input id="teamSize" type="text" placeholder="Example: 4" />
          </div>


          <div class="admin-addcat-half small">
            <label>
              <i class="fa-solid fa-wallet"></i>
              Budget
            </label>

            <input id="budget" type="number" placeholder="0" />
          </div>

        </div>



        <div class="admin-addcat-advisor">

          <div class="admin-addcat-advisor-title">
            <i class="fa-regular fa-address-card"></i>
            Need Advisor / Not
          </div>

          <div class="admin-addcat-toggle">
            <button type="button" id="advisorYes" class="active">
              Yes
            </button>

            <button type="button" id="advisorNo">
              No
            </button>
          </div>

        </div>



        <div class="admin-addcat-actions">

          <a href="ad-projectcat.html" class="admin-addcat-cancel">
            Cancel
          </a>

          <button type="submit" class="admin-addcat-create">
            Create Category
          </button>

        </div>

      </form>

    </main>
  
<script src="../../components/sidebar.js"></script>
<script src="../../components/topbar.js"></script>
  <script src="ad-addcategory.js"></script>

</body>

</html>
