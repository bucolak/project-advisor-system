<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Categories</title>

    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content">
            <div id="topbarArea"></div>

            <div class="admin-categories-header">
                <h1>Project Categories</h1>
                <button class="admin-categories-add-btn" onclick="window.location.href='./ad-addcategory.html'">
                    + Add New Category
                </button>
            </div>

            <div class="admin-categories-table-wrap">
                <table class="admin-categories-table">
                    <thead>
                        <tr>
                            <th>Category Name</th>
                            <th>Description</th>
                            <th>Active<br />Projects</th>
                            
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="categoriesTableBody">
                        <tr>
                            <td colspan="4">Loading categories...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    <script src="../../components/sidebar.js"></script>
    <script src="../../components/topbar.js"></script>
    <script src="ad-projectcat.js"></script>
</body>

</html>
