<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Announcement</title>

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
<div id="sidebarArea"></div>

<main class="page-content">

      <div id="topbarArea"></div>

      <h1 class="admin-addann-title">Edit The Announcement</h1>

      <form class="admin-addann-form" id="editAnnouncementForm">

        <div class="admin-addann-field full">
          <label>Title <span>*</span></label>
          <input type="text" id="announcementTitle" placeholder="Enter announcement title" />
        </div>

        <div class="admin-addann-grid">

          <div class="admin-addann-left">

            <div class="admin-addann-field">
              <label>Related Category <span>*</span></label>
              <select id="announcementCategory">
                <option value="">Loading categories...</option>
              </select>
            </div>

            <div class="admin-addann-field">
              <label>Deadline <span>*</span></label>
              <div class="admin-addann-datebox">
                <i class="fa-regular fa-calendar"></i>
                <input type="date" id="announcementDeadline" />
              </div>
            </div>

            <div class="admin-addann-field">
              <label>Announcement Type <span>*</span></label>
              <select id="announcementType">
                <option value="">Loading announcement types...</option>
              </select>
            </div>

          </div>

          <div class="admin-addann-right">
            <div class="admin-addann-field">
              <label>Description <span>*</span></label>
              <textarea id="announcementDescription" placeholder="Enter detailed description"></textarea>
            </div>
          </div>

        </div>

        <div class="admin-addann-actions">
          <a href="ad-announce.html" class="admin-addann-cancel">Cancel</a>

          <button type="submit" class="admin-addann-publish">
            Save Changes
          </button>
        </div>

      </form>

    </main>

  <script src="../../components/sidebar.js"></script>
  <script src="../../components/topbar.js"></script>
  <script src="ad-editannouncement.js"></script>

</body>

</html>
