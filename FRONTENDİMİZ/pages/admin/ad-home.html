<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Home</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="sidebarArea"></div>

<main class="page-content">

         <div id="topbarArea"></div>   

            <div class="admin-home-upper">
                <div class="admin-home-welcome-card">
                    <h2 id="adminWelcomeText">Loading...</h2>

                    <p><strong>Role:</strong> Admin</p>
                    <p><strong>System Access:</strong> Full Control</p>

                    <p class="admin-home-welcome-text">
                        You can manage categories, users and announcements.
                    </p>
                </div>
            </div>

            <div class="admin-home-middle">
                <div class="admin-home-announcements-card">
                    <h3>Announcements</h3>
                    <div class="admin-home-divider"></div>

                    <div id="adminAnnouncementsList">
                        <div class="admin-home-ann-item">
                            <i class="fa-regular fa-calendar"></i>
                            <span>Loading announcements...</span>
                        </div>
                    </div>
                </div>

                <div class="admin-home-overview-card">
                    <h3>User Overview</h3>
                    <div class="admin-home-divider"></div>

                    <div class="admin-home-overview-item">
                        <i class="fa-regular fa-user"></i>
                        <span id="totalUsersText">Loading...</span>
                    </div>

                    <div class="admin-home-overview-item">
                        <i class="fa-regular fa-circle-check green"></i>
                        <span id="activeUsersText">Loading...</span>
                    </div>

                    <div class="admin-home-overview-item">
                        <i class="fa-regular fa-square-xmark red"></i>
                        <span id="inactiveUsersText">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="admin-home-lower">
                <h3 class="admin-home-section-title">Project Categories</h3>

                <div class="admin-home-categories-wrapper" id="adminCategoriesWrapper">
                    <div class="admin-home-category-card">
                        <div class="admin-home-category-body">
                            <h4>Loading categories...</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-projects-modal-overlay" id="categoryProjectsModal">
                <div class="admin-projects-modal">
                    <div class="admin-projects-modal-header">
                        <h2 id="modalCategoryTitle">Projects</h2>
                        <span id="modalCategoryBadge" class="admin-projects-modal-badge">Loading...</span>
                    </div>

                    <div id="modalProjectsList" class="admin-projects-modal-list"></div>

                    <div class="admin-projects-modal-footer">
                        <button id="closeCategoryProjectsModal" class="admin-projects-cancel-btn">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>

        </main>
    <script src="../../components/sidebar.js"></script>
    <script src="../../components/topbar.js"></script>
    <script src="ad-home.js"></script>
</body>

</html>
