<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management</title>

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div class="admin-user-page">
    <aside class="admin-user-sidebar">
      <div class="admin-user-sidebar-icon">
        <i class="fa-solid fa-up-down-left-right"></i>
      </div>

      <ul class="admin-user-menu">
        <li>
          <a href="ad-home.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </li>

        <li>
          <a href="ad-projectcat.html">
            <i class="fa-regular fa-folder-open"></i>
            <span>Project Categories</span>
          </a>
        </li>

        <li>
          <a href="ad-announce.html">
            <i class="fa-regular fa-flag"></i>
            <span>Announcements<br>& Dates</span>
          </a>
        </li>

        <li>
          <a href="ad-user.html" class="active">
            <i class="fa-regular fa-user"></i>
            <span>User Management</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="admin-user-content">
      <div class="admin-user-topbar">
        <div class="admin-user-userbox">
          <i class="fa-regular fa-circle-user"></i>

          <div class="admin-user-userinfo">
            <span id="adminTopName">Admin</span>
            <small>Admin</small>
          </div>

          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>

      <h1 class="admin-user-title">User Management</h1>

      <div class="admin-user-filters">
        <div class="admin-user-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="userSearchInput" placeholder="Search users" />
        </div>

        <div class="admin-user-role-filter">
          <label for="roleSelect">Role:</label>

          <select id="roleSelect">
            <option value="all">All</option>
            <option value="admin">Admin</option>
            <option value="student">Student</option>
            <option value="advisor">Advisor</option>
          </select>
        </div>
      </div>

      <div class="admin-user-table-wrap">
        <table class="admin-user-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Department</th>
              <th>Status</th>
              <th>Date Created</th>
            </tr>
          </thead>

          <tbody id="userTableBody">
            <tr>
              <td colspan="5">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="ad-user.js"></script>
</body>

</html>
