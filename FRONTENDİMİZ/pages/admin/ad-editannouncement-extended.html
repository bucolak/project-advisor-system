<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit The Announcement</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="admin-editann-page">
    <aside class="admin-editann-sidebar">
      <div class="admin-editann-sidebar-icon">
        <i class="fa-solid fa-up-down-left-right"></i>
      </div>

      <ul class="admin-editann-menu">
        <li><a href="ad-home.html"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
        <li><a href="ad-projectcat.html"><i class="fa-regular fa-folder-open"></i><span>Project Categories</span></a></li>
        <li><a href="ad-announce.html" class="active"><i class="fa-regular fa-flag"></i><span>Announcements <br>& Dates</span></a></li>
        <li><a href="ad-user.html"><i class="fa-regular fa-user"></i><span>User Management</span></a></li>
      </ul>
    </aside>

    <main class="admin-editann-content">
      <div class="admin-editann-topbar">
        <div class="admin-editann-userbox">
          <i class="fa-regular fa-circle-user"></i>
          <div class="admin-editann-userinfo">
            <span>Ali Yılmaz</span>
            <small>Admin</small>
          </div>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>

      <h1 class="admin-editann-title">Edit The Announcement</h1>

      <form class="admin-editann-form">
        <div class="admin-editann-field full">
          <label>Title <span>*</span></label>
          <input type="text" value="TÜBİTAK Deadline Extended Again" />
        </div>

        <div class="admin-editann-grid">
          <div class="admin-editann-left">
            <div class="admin-editann-field">
              <label>Related Category <span>*</span></label>
              <select>
                <option>Select a project type</option>
                <option selected>TÜBİTAK</option>
                <option>Teknofest</option>
                <option>Course</option>
              </select>
            </div>

            <div class="admin-editann-field">
              <label>Deadline <span>*</span></label>
              <div class="admin-editann-datebox">
                <i class="fa-regular fa-calendar"></i>
                <input type="text" value="July 01, 2026" />
              </div>
            </div>

            <div class="admin-editann-field">
              <label>Announcement Type <span>*</span></label>
              <select>
                <option>Select a project type</option>
                <option>Application deadlines</option>
                <option>Evaluation Dates</option>
                <option selected>Result Announcement Dates</option>
              </select>
            </div>
          </div>

          <div class="admin-editann-right">
            <div class="admin-editann-field">
              <label>Description <span>*</span></label>
              <textarea>Deadline has been extended once more.</textarea>
            </div>
          </div>
        </div>

        <div class="admin-editann-actions">
          <a href="ad-announce.html" class="admin-editann-cancel">Cancel</a>
          <button type="submit" class="admin-editann-publish">Publish Announcement</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
