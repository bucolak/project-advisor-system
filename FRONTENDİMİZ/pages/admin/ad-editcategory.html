<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Category</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="admin-editcat-page">
    <aside class="admin-editcat-sidebar">
      <div class="admin-editcat-sidebar-icon">
        <i class="fa-solid fa-up-down-left-right"></i>
      </div>

      <ul class="admin-editcat-menu">
        <li>
          <a href="ad-home.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </li>

        <li>
          <a href="ad-projectcat.html" class="active">
            <i class="fa-regular fa-folder-open"></i>
            <span>Project Categories</span>
          </a>
        </li>

        <li>
          <a href="ad-announce.html">
            <i class="fa-regular fa-flag"></i>
            <span>Announcements <br>& Dates</span>
          </a>
        </li>

        <li>
          <a href="ad-user.html">
            <i class="fa-regular fa-user"></i>
            <span>User Management</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="admin-editcat-content">
      <div class="admin-editcat-topbar">
        <div class="admin-editcat-userbox">
          <i class="fa-regular fa-circle-user"></i>
          <div class="admin-editcat-userinfo">
            <span>Ali Yılmaz</span>
            <small>Admin</small>
          </div>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>

      <h1 class="admin-editcat-title">Edit Category</h1>

      <div class="admin-editcat-card">
        <div class="admin-editcat-field">
          <label>
            <i class="fa-regular fa-folder-open"></i>
            Category Name
          </label>
          <input type="text" value="TÜBİTAK Projects" />
        </div>

        <div class="admin-editcat-field">
          <label>
            <i class="fa-regular fa-folder"></i>
            Description
          </label>
          <textarea>Student research projects</textarea>
        </div>

        <div class="admin-editcat-row">
          <div class="admin-editcat-half">
            <label>
              <i class="fa-solid fa-users"></i>
              Team Size(min-max)
            </label>
            <input type="text" value="2-5" />
          </div>

          <div class="admin-editcat-half small">
            <label>
              <i class="fa-solid fa-wallet"></i>
              Budget
            </label>
            <input type="text" value="₺ 10000" />
          </div>
        </div>

        <div class="admin-editcat-advisor">
          <div class="admin-editcat-advisor-title">
            <i class="fa-regular fa-address-card"></i>
            Need Advisor / Not
          </div>

          <div class="admin-editcat-toggle">
            <button type="button" class="active">Yes</button>
            <button type="button">No</button>
          </div>
        </div>

        <div class="admin-editcat-actions">
          <a href="ad-projectcat.html" class="admin-editcat-cancel">Cancel</a>
          <button class="admin-editcat-save">Save Changes</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
